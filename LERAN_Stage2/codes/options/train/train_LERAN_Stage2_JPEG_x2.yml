#### general settings
name: LERAN_Stage2_JPEG_x2_DIV2K
use_tb_logger: true
model: LERAN_Stage2
scale: 2
gpu_ids: [0]

#### datasets
datasets:
  train:
    name: DIV2K
    mode: LQGT
    dataroot_GT: /hy-tmp/Datasets/SISR_datasets/DIV2K/DIV2K_train_HR
    use_shuffle: true
    n_workers: 6  # per GPU
    batch_size: 16
    GT_size: 128
    use_flip: true
    use_rot: true
    color: RGB

  val:
    name: val_DIV2K
    mode: LQGT
    dataroot_GT: /hy-tmp/Datasets/Vid4

#### network structures
network_G:
  which_model_G:
      subnet_type: None
  in_nc: 3
  out_nc: 3
  scale: 2
  init: xavier

network_G2:
  which_model_G:
      subnet_type: None
  in_nc: 3
  out_nc: 3
  scale: 2
  init: xavier
  
#### path
path:
  pretrain_model_G: ./experiments/LERAN_Stage1_netG.pth
  strict_load: false
  resume_state: ~

path2:
  pretrain_model_G: ./experiments/LERAN_Stage1_netG2.pth
  strict_load: false
  resume_state: ~
  
#### training settings: learning rate scheme, loss
train:
  use_diffcomp: true
  use_realcomp: true
  comp_format: JPEG
  test_val_comp_quality: 50
  train_comp_quality1: 50
  train_comp_quality2: 85
  
  lr: !!float 2e-4
  beta1: 0.9
  beta2: 0.999
  niter: 80000
  warmup_iter: -1  # no warm up

  lr_scheme: MultiStepLR
  lr_steps: [20000, 40000, 60000]
  lr_gamma: 0.5

  pixel_criterion_forw: l2
  pixel_criterion_back: l1

  manual_seed: 10

  val_freq: !!float 5000

  lambda_fit_forw: 4
  lambda_rec_back: 1
  weight_decay: !!float 1e-5
  gradient_clipping: 10

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 20000